[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cropxai"
version = "0.1.0"
description = "Crop-leaf disease detection with Grad-CAM++ explanations under model compression, deployed on-device."
requires-python = ">=3.10"
# Core deps: enough to build splits and run the unit tests.
dependencies = [
    "numpy>=2.0",       # np.bitwise_count for hash distances
    "pandas>=2.1",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "omegaconf>=2.3",
    "scikit-learn>=1.4",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Training / research environment (Colab). Torch and torchvision are
# preinstalled on Colab, so they are not listed here (pip would otherwise
# re-check them every session); exact versions of every run are captured by
# W&B and written into each results JSON. Only what the code imports today:
# add packages in the phase that first uses them.
train = [
    "timm>=1.0",
    "albumentations>=2.0",
    "wandb>=0.17",
    "grad-cam>=1.5",
]
# Phase 4 (structured pruning, INT8 quantization).
compress = [
    "torch-pruning>=1.5",
    "torchao>=0.10",
]
dev = ["pytest>=8"]
# Web-app export (scripts/export_web.py): ONNX graph + ONNX Runtime for the parity tests.
web = [
    "onnx>=1.16",
    "onnxruntime>=1.18",
]
# The ExecuTorch export environment is deliberately NOT an extra here:
# it must live in its own environment. See requirements/export.txt.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
