# Explanation evaluation (Phase 3, reused unchanged at every compression level).
explain:
  splits: [test, field_test]     # field_test images with lesion masks are always included
  n_images: 300                  # per split; same seeded sample for every model
  sample_seed: 0
  methods: [gradcampp, gradcam, scorecam]
  scorecam_n_images: 50          # Score-CAM: one forward pass per channel per image (slow)
  batch_size: 32
  scorecam_batch_size: 128       # masked inputs per forward pass (inference only)
  deletion:
    n_steps: 20
    blur_kernel: 21              # insertion starts from a Gaussian-blurred image
    blur_sigma: 5.0
  road_percentiles: [20, 40, 60, 80]
  road_n_images: 100             # imputation is batched on the GPU (eval/faithfulness.py)
  iou_threshold: 0.5             # heatmap >= threshold counts as "highlighted"
  n_figure_examples: 8
  verify_n_images: 64            # closed-form vs library comparison
