# Render Blueprint for the demo website (a static site: the model runs in the
# visitor's browser, so there is no server). The model bundles and results data
# are committed under web/public/, so Render only needs Node to build.
# To refresh them: scripts/export_web.py (per model), then scripts/export_site_data.py.
services:
  - type: web
    name: cropxai
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      # Render does not serve index.html for "/" on this site, so map it explicitly
      # (the service worker also precaches "./").
      - type: rewrite
        source: /
        destination: /index.html
    # Security headers: keep in sync with web/security-headers.js
    # (web/test/headers.test.mjs checks this).
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      # Caching: build assets have content hashes in their names; pages, the
      # service worker and its file list must always be revalidated.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.html
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /precache.json
        name: Cache-Control
        value: no-cache
