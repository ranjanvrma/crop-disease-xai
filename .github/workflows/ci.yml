name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WANDB_MODE: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Python packages (CPU torch)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[train,compress,dev,web]"
      - name: Python tests
        run: python -m pytest -q -p no:warnings
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web app parity tests
        run: |
          python web/test/make_fixtures.py
          python scripts/export_web.py --config configs/experiment/mnv3_fe.yaml --demo
          cd web && npm ci && npm test
      - name: Web app browser tests
        working-directory: web
        run: |
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
