name: name-check
# Fails the build if any tracked file, file name, commit message, author or
# committer contains a blocked AI-assistant name (see scripts/check_names.py).
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history, so every commit is checked
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_names.py --all
